services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crescendo
      POSTGRES_PASSWORD: crescendo
      POSTGRES_DB: crescendo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crescendo"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://crescendo:crescendo@db:5432/crescendo
      JWT_SECRET: local-dev-secret-change-in-production-min-32
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
